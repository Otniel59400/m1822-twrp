name: Build TWRP - Meizu Note 8 M1822

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C
      LANG: C
      TZ: UTC

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 8
      # ============================================================
      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      # ============================================================
      # 3. System dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libreadline-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      # ============================================================
      # 4. Python 2.7
      # ============================================================
      - name: Install Python 2.7
        shell: bash
        run: |
          set -e

          PYTHON_VERSION="2.7.18"
          PYTHON_PREFIX="$HOME/python2"

          mkdir -p "$HOME/src"

          cd "$HOME/src"

          curl -L \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz" \
            -o python2.tar.gz

          tar -xzf python2.tar.gz

          cd "Python-${PYTHON_VERSION}"

          ./configure \
            --prefix="$PYTHON_PREFIX" \
            --enable-unicode=ucs4 \
            --with-ensurepip=no

          make -j"$(nproc)"
          make install

          mkdir -p "$PYTHON_PREFIX/bin"

          ln -sf \
            "$PYTHON_PREFIX/bin/python2.7" \
            "$PYTHON_PREFIX/bin/python"

          echo "$PYTHON_PREFIX/bin" >> "$GITHUB_PATH"

          echo
          echo "============================================"
          echo "Python 2 installation"
          echo "============================================"

          "$PYTHON_PREFIX/bin/python2.7" --version
          "$PYTHON_PREFIX/bin/python" --version

      # ============================================================
      # 5. Configure Python 2
      # ============================================================
      - name: Configure Python 2 environment
        shell: bash
        run: |
          set -e

          PYTHON2="$HOME/python2/bin/python"

          echo "PYTHON=$PYTHON2" >> "$GITHUB_ENV"
          echo "PYTHON2=$PYTHON2" >> "$GITHUB_ENV"

          export PATH="$HOME/python2/bin:$PATH"
          export PYTHON="$PYTHON2"

          echo
          echo "============================================"
          echo "Python environment"
          echo "============================================"

          echo "Python:"
          python --version

          echo
          echo "Python executable:"
          which python

          echo
          echo "Resolved path:"
          readlink -f "$(which python)"

      # ============================================================
      # 6. Install repo
      # ============================================================
      - name: Install repo
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          echo
          echo "repo version:"
          "$HOME/bin/repo" --version

      # ============================================================
      # 7. Initialize TWRP 8.1 source
      # ============================================================
      - name: Initialize TWRP source
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/twrp"

          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

      # ============================================================
      # 8. Sync TWRP source
      # ============================================================
      - name: Sync TWRP source
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      # ============================================================
      # 9. Install M1822 device tree
      # ============================================================
      - name: Install M1822 device tree
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/twrp/device/meizu"

          rm -rf \
            "$GITHUB_WORKSPACE/twrp/device/meizu/m1822"

          cp -a \
            "$GITHUB_WORKSPACE/device/meizu/m1822" \
            "$GITHUB_WORKSPACE/twrp/device/meizu/"

          echo
          echo "Installed M1822 device tree:"
          find \
            "$GITHUB_WORKSPACE/twrp/device/meizu/m1822" \
            -maxdepth 3 \
            -type f \
            | sort

      # ============================================================
      # 10. Verify M1822 kernel
      # ============================================================
      - name: Verify M1822 kernel
        shell: bash
        run: |
          set -e

          KERNEL="$GITHUB_WORKSPACE/twrp/device/meizu/m1822/prebuilt/kernel"

          if [ ! -f "$KERNEL" ]; then
            echo "ERROR: Prebuilt kernel not found:"
            echo "$KERNEL"
            exit 1
          fi

          echo
          echo "Prebuilt kernel:"
          ls -lh "$KERNEL"

          echo
          echo "Kernel SHA256:"
          sha256sum "$KERNEL"

      # ============================================================
      # 11. Verify M1822 configuration
      # ============================================================
      - name: Verify M1822 configuration
        shell: bash
        run: |
          set -e

          DEVICE="$GITHUB_WORKSPACE/twrp/device/meizu/m1822"

          test -f "$DEVICE/BoardConfig.mk"
          test -f "$DEVICE/AndroidProducts.mk"
          test -f "$DEVICE/omni_m1822.mk"
          test -f "$DEVICE/device.mk"
          test -f "$DEVICE/recovery.fstab"
          test -f "$DEVICE/system.prop"
          test -f "$DEVICE/prebuilt/kernel"

          echo
          echo "M1822 device tree verification passed."

          echo
          echo "Board configuration:"
          grep -E \
            'TARGET_ARCH|TARGET_BOARD_PLATFORM|TARGET_BOOTLOADER_BOARD_NAME|TARGET_PREBUILT_KERNEL|BOARD_KERNEL_BASE|BOARD_KERNEL_PAGESIZE|BOARD_KERNEL_CMDLINE|BOARD_RECOVERYIMAGE_PARTITION_SIZE' \
            "$DEVICE/BoardConfig.mk" || true

      # ============================================================
      # 12. Configure Android/TWRP build environment
      # ============================================================
      - name: Configure build environment
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          export PATH="$HOME/python2/bin:$PATH"
          export PYTHON="$HOME/python2/bin/python"
          export PYTHON2="$HOME/python2/bin/python"
          export ALLOW_MISSING_DEPENDENCIES=true

          echo
          echo "============================================"
          echo "Build environment"
          echo "============================================"

          echo
          echo "Java:"
          java -version

          echo
          echo "Python:"
          python --version

          echo
          echo "Python executable:"
          which python

          echo
          echo "Python resolved path:"
          readlink -f "$(which python)"

          echo
          echo "ALLOW_MISSING_DEPENDENCIES:"
          echo "$ALLOW_MISSING_DEPENDENCIES"

          echo
          echo "Initializing Android build environment..."

          source build/envsetup.sh

          echo
          echo "Selecting M1822 target..."

          lunch omni_m1822-eng

      # ============================================================
      # 13. Build recovery image
      # ============================================================
      - name: Build recovery image
        shell: bash
        timeout-minutes: 60
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          export PATH="$HOME/python2/bin:$PATH"
          export PYTHON="$HOME/python2/bin/python"
          export PYTHON2="$HOME/python2/bin/python"
          export ALLOW_MISSING_DEPENDENCIES=true

          echo
          echo "============================================"
          echo "Starting TWRP recoveryimage build"
          echo "============================================"

          source build/envsetup.sh

          lunch omni_m1822-eng

          mka recoveryimage

      # ============================================================
      # 14. Validate recovery image
      # ============================================================
      - name: Validate recovery image
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/twrp/out/target/product/m1822"
          RECOVERY="$PRODUCT/recovery.img"

          echo
          echo "Looking for:"
          echo "$RECOVERY"

          if [ ! -f "$RECOVERY" ]; then
            echo
            echo "ERROR: recovery.img was NOT generated."
            echo
            echo "Files in product directory:"

            find "$PRODUCT" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort || true

            exit 1
          fi

          echo
          echo "============================================"
          echo "Recovery generated successfully"
          echo "============================================"

          echo
          echo "File:"
          ls -lh "$RECOVERY"

          echo
          echo "Type:"
          file "$RECOVERY"

          echo
          echo "SHA256:"
          sha256sum "$RECOVERY"

          echo
          echo "Size:"
          stat -c '%s bytes' "$RECOVERY"

      # ============================================================
      # 15. Collect artifacts
      # ============================================================
      - name: Collect recovery artifacts
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/twrp/out/target/product/m1822"
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$ARTIFACTS"

          cp \
            "$PRODUCT/recovery.img" \
            "$ARTIFACTS/recovery.img"

          sha256sum \
            "$ARTIFACTS/recovery.img" \
            > "$ARTIFACTS/recovery.img.sha256"

          cp \
            "$GITHUB_WORKSPACE/device/meizu/m1822/BoardConfig.mk" \
            "$ARTIFACTS/BoardConfig.mk"

          echo
          echo "Artifacts:"
          ls -lh "$ARTIFACTS"

      # ============================================================
      # 16. Upload artifact
      # ============================================================
      - name: Upload TWRP recovery
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m1822-recovery
          path: artifacts/
          if-no-files-found: error
